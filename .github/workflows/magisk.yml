name: Build Magisk Module

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DCMAKE_CXX_FLAGS="-std=c++20 -Wall -Wextra -Werror=format-security -fno-exceptions -fno-rtti -ffast-math -funwind-tables -fstack-protector-strong" \
            -GNinja
          ninja
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK }}

      - name: Create module
        run: |
          mkdir -p magisk_module/system/bin
          mkdir -p magisk_module/logs
          mkdir -p magisk_module/webroot
          mkdir -p magisk_module/data
          mkdir -p magisk_module/META-INF/com/google/android
          cp build/hyperpredictd magisk_module/system/bin/
          chmod 755 magisk_module/system/bin/hyperpredictd
          cp -r webroot/* magisk_module/webroot/
          cp module.prop magisk_module/

      - name: Create module.prop
        run: |
          echo "id=hyperpredict" > magisk_module/module.prop
          echo "name=HyperPredict" >> magisk_module/module.prop
          echo "version=v4.3.0" >> magisk_module/module.prop
          echo "versionCode=430" >> magisk_module/module.prop
          echo "author=ye3912" >> magisk_module/module.prop
          echo "description=AI CPU Scheduler with KSU WebUI Support" >> magisk_module/module.prop
          echo "webui=webroot" >> magisk_module/module.prop

      - name: Create scripts
        run: |
          cat > magisk_module/service.sh << 'SERVICESH'
          #!/system/bin/sh
          # HyperPredict 服务启动脚本
          MODDIR=${0%/*}
          LOGFILE="$MODDIR/logs/hp.log"
          PIDFILE="$MODDIR/logs/hp.pid"

          # 等待系统启动完成
          sleep 15

          # 创建日志目录
          mkdir -p "$MODDIR/logs"

          # 检查是否已经在运行
          if [ -f "$PIDFILE" ]; then
              OLD_PID=$(cat "$PIDFILE")
              if kill -0 "$OLD_PID" 2>/dev/null; then
                  exit 0
              fi
          fi

          # 停止旧进程
          pkill -9 hyperpredictd 2>/dev/null || true
          sleep 1

          # 启动守护进程
          nohup "$MODDIR/system/bin/hyperpredictd" --mod-dir "$MODDIR" >> "$LOGFILE" 2>&1 &
          PID=$!
          echo "$PID" > "$PIDFILE"
          SERVICESH
          chmod 755 magisk_module/service.sh

          cat > magisk_module/META-INF/com/google/android/update-binary << 'UPDATEBINARY'
          #!/sbin/sh
          # Magisk Module Installer Script

          OUTFD=$2
          ZIPFILE=$3

          # 检测模块管理器
          if [ -n "$KSU" ]; then
              echo "KernelSU detected"
          elif [ -n "$APATCH" ]; then
              echo "APatch detected"
          elif [ -n "$MAGISK_VER" ]; then
              echo "Magisk detected"
          else
              echo "Unknown module manager"
          fi

          # 解压模块
          unzip -o "$ZIPFILE" -d "$MODPATH"

          # 设置权限
          chmod 755 "$MODPATH/system/bin/hyperpredictd"
          chmod 755 "$MODPATH/service.sh"
          if [ -f "$MODPATH/uninstall.sh" ]; then
              chmod 755 "$MODPATH/uninstall.sh"
          fi
          if [ -f "$MODPATH/scripts/install_module.sh" ]; then
              chmod 755 "$MODPATH/scripts/install_module.sh"
          fi

          echo "HyperPredict 安装完成"
          UPDATEBINARY
          chmod 755 magisk_module/META-INF/com/google/android/update-binary
          
          echo '#MAGISK' > magisk_module/META-INF/com/google/android/updater-script

      - name: Create Scene files
        run: |
          echo '#!/system/bin/sh' > magisk_module/data/powercfg.sh
          echo 'MODE_FILE="/data/hyperpredict_mode"' >> magisk_module/data/powercfg.sh
          echo 'case "$1" in' >> magisk_module/data/powercfg.sh
          echo '  init) echo "HyperPredict initialized";;' >> magisk_module/data/powercfg.sh
          echo '  powersave|balance|performance|fast|pedestal) echo "$1" > "$MODE_FILE";;' >> magisk_module/data/powercfg.sh
          echo '  *) echo "$1" > "$MODE_FILE" 2>/dev/null || true;;' >> magisk_module/data/powercfg.sh
          echo 'esac' >> magisk_module/data/powercfg.sh
          chmod 755 magisk_module/data/powercfg.sh
          
          echo '{"version":"HyperPredict","versionCode":430,"author":"HyperPredict","projectUrl":"https://github.com/ye3912/HyperPredict","features":{"pedestal":false,"fas":true},"state":"/data/hyperpredict_mode"}' > magisk_module/data/powercfg.json

      - name: Package
        run: |
          cd magisk_module
          zip -r ../HyperPredict.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HyperPredict-Magisk
          path: HyperPredict.zip
          retention-days: 30
